<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#07111f"
  >

  <title>
    Phoenix Quest | 10 Gates
  </title>


  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    :root{
      --bg:#07111f;
      --card:#0d1b2e;
      --navy:#12233f;
      --orange:#ff6427;
      --gold:#f4b942;
      --white:#ffffff;
      --muted:#98a6b7;
      --border:rgba(255,255,255,.10);
      --red:#ff5151;
      --green:#4fd68b;
    }

    body{
      min-height:100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at 90% 5%,
          rgba(255,100,39,.15),
          transparent 30%
        ),
        var(--bg);

      color:var(--white);
    }


    /* HEADER */

    header{
      position:sticky;
      top:0;
      z-index:100;

      background:
        rgba(7,17,31,.92);

      backdrop-filter:blur(15px);

      border-bottom:
        1px solid var(--border);
    }

    .nav{
      width:min(1100px,calc(100% - 24px));
      min-height:68px;
      margin:auto;

      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:15px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .brand img{
      width:42px;
      height:42px;
      object-fit:contain;
      border-radius:11px;
      background:white;
    }

    .brand strong{
      display:block;
      font-size:13px;
    }

    .brand span{
      display:block;
      color:var(--muted);
      font-size:10px;
    }

    .exit{
      color:var(--muted);
      text-decoration:none;
      font-size:12px;
      font-weight:800;
    }


    /* MAIN */

    .quest{
      width:min(820px,calc(100% - 24px));
      margin:auto;
      padding:32px 0 70px;
    }


    /* PLAYER BAR */

    .player-bar{
      display:grid;
      grid-template-columns:1fr auto;
      gap:15px;

      background:
        rgba(255,255,255,.05);

      border:
        1px solid var(--border);

      border-radius:16px;

      padding:15px 17px;

      margin-bottom:18px;
    }

    .player-bar span{
      display:block;

      color:var(--muted);

      font-size:10px;

      text-transform:uppercase;

      letter-spacing:1px;
    }

    .player-bar strong{
      display:block;
      margin-top:2px;
    }

    .xp{
      color:var(--gold);
      text-align:right;
    }


    /* GATE PROGRESS */

    .gate-progress{
      display:grid;
      grid-template-columns:
        repeat(10,1fr);

      gap:5px;

      margin-bottom:20px;
    }

    .gate-dot{
      height:6px;

      border-radius:20px;

      background:
        rgba(255,255,255,.10);
    }

    .gate-dot.done{
      background:var(--orange);
    }

    .gate-dot.current{
      background:var(--gold);
    }


    /* GATE CARD */

    .gate-card{
      background:
        rgba(13,27,46,.92);

      border:
        1px solid var(--border);

      border-radius:26px;

      overflow:hidden;

      box-shadow:
        0 25px 70px
        rgba(0,0,0,.28);
    }

    .gate-top{
      padding:28px;

      background:
        linear-gradient(
          145deg,
          rgba(255,100,39,.16),
          rgba(255,255,255,.02)
        );

      border-bottom:
        1px solid var(--border);
    }

    .gate-number{
      color:var(--orange);

      font-size:11px;

      font-weight:900;

      letter-spacing:2px;

      margin-bottom:9px;
    }

    .gate-top h1{
      font-size:
        clamp(28px,7vw,45px);

      line-height:1;
    }

    .gate-subtitle{
      color:var(--muted);

      margin-top:10px;

      font-size:13px;
    }


    /* CLUE */

    .gate-body{
      padding:28px;
    }

    .clue{
      color:#edf1f6;

      font-size:
        clamp(17px,4vw,21px);

      line-height:1.75;

      white-space:pre-line;

      margin-bottom:27px;
    }


    /* XP RULE */

    .xp-rule{
      display:flex;
      flex-wrap:wrap;
      gap:7px;

      margin-bottom:22px;
    }

    .xp-chip{
      padding:6px 9px;

      border-radius:50px;

      background:
        rgba(255,255,255,.06);

      color:var(--muted);

      font-size:10px;

      font-weight:800;
    }


    /* ANSWER FIELD */

    .answer-label{
      display:block;

      font-size:11px;

      font-weight:900;

      margin-bottom:7px;
    }

    .answer-wrap{
      position:relative;
    }

    #gateAnswer{
      width:100%;

      padding:15px 50px 15px 14px;

      border-radius:13px;

      border:
        1px solid var(--border);

      outline:none;

      background:
        rgba(255,255,255,.06);

      color:white;

      font-size:15px;
    }

    #gateAnswer:focus{
      border-color:var(--orange);
    }

    #gateAnswer.error{
      border-color:var(--red);
      background:
        rgba(255,81,81,.07);

      animation:shake .35s;
    }

    .eye{
      position:absolute;

      right:7px;
      top:50%;

      transform:
        translateY(-50%);

      width:40px;
      height:40px;

      border:0;

      background:transparent;

      color:white;

      cursor:pointer;
    }

    @keyframes shake{

      0%,100%{
        transform:translateX(0);
      }

      25%{
        transform:translateX(-7px);
      }

      50%{
        transform:translateX(7px);
      }

      75%{
        transform:translateX(-4px);
      }

    }


    /* MESSAGE */

    .gate-message{
      min-height:22px;

      margin-top:10px;

      font-size:12px;

      font-weight:800;
    }

    .gate-message.error{
      color:#ff9b9b;
    }

    .gate-message.success{
      color:var(--green);
    }


    /* BUTTON */

    .unlock-btn{
      width:100%;

      margin-top:12px;

      padding:15px;

      border:0;

      border-radius:13px;

      background:
        linear-gradient(
          135deg,
          var(--orange),
          #d94a14
        );

      color:white;

      font-weight:900;

      cursor:pointer;
    }


    /* LOADING */

    .loading{
      text-align:center;
      padding:70px 20px;
      color:var(--muted);
    }


    @media(max-width:500px){

      .quest{
        padding-top:20px;
      }

      .gate-top,
      .gate-body{
        padding:22px 18px;
      }

      .brand span{
        display:none;
      }

      .player-bar{
        padding:13px;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="nav">


    <a
      href="index.html"
      class="brand"
      style="text-decoration:none;color:white;"
    >

      <img
        src="images/logo.jpg"
        alt="Phoenix Logo"
      >

      <div>

        <strong>
          PHOENIX QUEST
        </strong>

        <span>
          10 Gates • 300 XP
        </span>

      </div>

    </a>


    <a
      href="index.html"
      class="exit"
    >
      Exit Quest
    </a>


  </div>

</header>



<main class="quest">


  <!-- PARTICIPANT -->

  <section class="player-bar">

    <div>

      <span>
        Phoenix
      </span>

      <strong id="playerName">
        Loading...
      </strong>

    </div>


    <div class="xp">

      <span>
        Quest XP
      </span>

      <strong id="playerXP">
        0 XP
      </strong>

    </div>

  </section>



  <!-- 10 GATE PROGRESS -->

  <div
    id="gateProgress"
    class="gate-progress"
    aria-label="Quest progress"
  >

    <div class="gate-dot"></div>
    <div class="gate-dot"></div>
    <div class="gate-dot"></div>
    <div class="gate-dot"></div>
    <div class="gate-dot"></div>
    <div class="gate-dot"></div>
    <div class="gate-dot"></div>
    <div class="gate-dot"></div>
    <div class="gate-dot"></div>
    <div class="gate-dot"></div>

  </div>



  <!-- LOADING -->

  <div
    id="questLoading"
    class="loading"
  >

    Verifying Phoenix identity...

  </div>



  <!-- GATE -->

  <section
    id="gateCard"
    class="gate-card"
    style="display:none;"
  >


    <div class="gate-top">

      <div
        id="gateNumber"
        class="gate-number"
      >
        GATE 01 / 10
      </div>


      <h1 id="gateTitle">
        Gate Title
      </h1>


      <p
        id="gateSubtitle"
        class="gate-subtitle"
      >
        Solve the clue to continue.
      </p>

    </div>



    <div class="gate-body">


      <div
        id="gateClue"
        class="clue"
      >
        Gate clue appears here.
      </div>



      <div class="xp-rule">

        <span class="xp-chip">
          1st Attempt • 30 XP
        </span>

        <span class="xp-chip">
          2nd • 25 XP
        </span>

        <span class="xp-chip">
          3rd • 20 XP
        </span>

        <span class="xp-chip">
          4th+ • 15 XP
        </span>

      </div>



      <label
        for="gateAnswer"
        class="answer-label"
      >
        ENTER YOUR KEY
      </label>


      <div class="answer-wrap">

        <input
          id="gateAnswer"
          type="password"
          placeholder="Type the exact answer"
          autocomplete="off"
        >


        <button
          id="toggleAnswer"
          class="eye"
          type="button"
          aria-label="Show answer"
        >
          👁
        </button>

      </div>



      <div
        id="gateMessage"
        class="gate-message"
      ></div>



      <button
        id="unlockGateBtn"
        class="unlock-btn"
        type="button"
      >
        UNLOCK GATE →
      </button>


    </div>

  </section>


</main>



<script src="quest.js"></script>


<script>

  /* =========================================
     ANSWER VISIBILITY
  ========================================== */

  const gateAnswer =
    document.getElementById(
      "gateAnswer"
    );


  const toggleAnswer =
    document.getElementById(
      "toggleAnswer"
    );


  toggleAnswer.addEventListener(
    "click",
    function(){

      const hidden =
        gateAnswer.type ===
        "password";


      gateAnswer.type =
        hidden
        ? "text"
        : "password";


      toggleAnswer.textContent =
        hidden
        ? "🙈"
        : "👁";

    }
  );



  /* =========================================
     IMPORTANT

     quest.js should initialise this page.

     Expected methods:

     PhoenixQuest.loadQuestPage()

     PhoenixQuest.submitGateAnswer(answer)

     The actual 10 Gate clues,
     answers, XP attempts and saved
     progress remain inside quest.js.
  ========================================== */


  function startQuestPage(){

    if(
      typeof PhoenixQuest ===
      "undefined"
    ){

      document.getElementById(
        "questLoading"
      ).textContent =
        "Quest engine could not be loaded.";

      return;
    }


    if(
      typeof PhoenixQuest
      .loadQuestPage ===
      "function"
    ){

      PhoenixQuest.loadQuestPage();

    }

  }


  document
  .getElementById(
    "unlockGateBtn"
  )
  .addEventListener(
    "click",
    function(){

      const answer =
        gateAnswer
        .value
        .trim();


      if(!answer){

        const message =
          document.getElementById(
            "gateMessage"
          );


        message.textContent =
          "Enter a key before attempting to unlock the Gate.";


        message.className =
          "gate-message error";


        gateAnswer
          .classList
          .add(
            "error"
          );


        setTimeout(
          function(){

            gateAnswer
              .classList
              .remove(
                "error"
              );

          },
          400
        );


        return;

      }


      if(
        typeof PhoenixQuest
        .submitGateAnswer ===
        "function"
      ){

        PhoenixQuest
          .submitGateAnswer(
            answer
          );

      }

    }
  );



  /* ENTER KEY ALSO SUBMITS */

  gateAnswer.addEventListener(
    "keydown",
    function(event){

      if(
        event.key ===
        "Enter"
      ){

        event.preventDefault();

        document
        .getElementById(
          "unlockGateBtn"
        )
        .click();

      }

    }
  );



  document.addEventListener(
    "DOMContentLoaded",
    startQuestPage
  );

</script>


</body>

</html>
